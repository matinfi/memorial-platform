name: Code syntax checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Lint PHP files
        run: find plugin theme -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Check JavaScript syntax
        run: find plugin theme -name '*.js' -print0 | xargs -0 -n1 node --check
